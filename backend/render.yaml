# Blueprint Render — code-dynamic-api (plan gratuito)
# Uso: render.com → New → Blueprint → selecciona renpereiradx/code-dynamic.
# Luego define SMTP_USER/SMTP_PASS en el dashboard (o vía API).
services:
  - type: web
    name: code-dynamic-api
    runtime: go
    plan: free
    buildCommand: cd backend && go build -o ../server ./cmd/api
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://code-dynamic.pages.dev
      - key: CONTACT_TO
        value: codedynamicdev@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false # definir en dashboard (tu Gmail)
      - key: SMTP_PASS
        sync: false # definir en dashboard (App Password, secreto)
      - key: RATE_LIMIT_MAX
        value: "3"
      - key: RATE_LIMIT_WINDOW
        value: 1h
# NOTA plan free: el servicio duerme tras inactividad (~15 min).
# El primer envío tras dormir tarda ~30-60 s (cold start).
